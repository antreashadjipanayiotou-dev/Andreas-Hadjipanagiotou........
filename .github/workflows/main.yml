name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Application ZIP
        run: |
          mkdir project
          unzip -o AndreasApp-FINAL-CORRECTED-FILL-SCREEN-SLIGHTLY-UP-CLEAN-PHOTO.zip -d project

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AndreasApp-debug
          path: project/app/build/outputs/apk/debug/*.apk
